seed: 42
num_steps_per_env: 100
max_iterations: 2000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 50
experiment_name: go2_him
run_name: local_2000
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
upload_model: true
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: go2_him.him.modules:HIMActor
  term_dims: !!python/tuple
  - 3
  - 3
  - 3
  - 12
  - 12
  - 12
  history_length: 6
  target_slice: !!python/tuple
  - 3
  - 48
  enc_hidden_dims: !!python/tuple
  - 128
  - 64
  tar_hidden_dims: !!python/tuple
  - 128
  - 64
  latent_dim: 16
  num_prototype: 32
  temperature: 3.0
  estimator_learning_rate: 0.001
  estimator_max_grad_norm: 10.0
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: go2_him.him.algorithm:HIMPPO
  vel_slice: !!python/tuple
  - 45
  - 48
